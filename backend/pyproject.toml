[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "resumemaker-backend"
version = "0.1.0"
description = "AI-powered resume optimization platform — backend"
requires-python = ">=3.12,<3.14"
dependencies = [
    # Web framework
    "fastapi==0.111.1",
    "uvicorn[standard]==0.30.1",
    "python-multipart==0.0.9",

    # Database
    "sqlalchemy==2.0.31",
    "asyncpg==0.29.0",
    "alembic==1.13.2",

    # Validation
    "pydantic==2.8.2",
    "pydantic-settings==2.3.4",
    "email-validator==2.2.0",

    # Auth / Security
    "argon2-cffi==23.1.0",
    "python-jose[cryptography]==3.3.0",

    # Document processing
    "python-docx==1.1.2",
    "pdfplumber==0.11.2",
    "pdfminer.six==20231228",

    # PDF rendering
    "reportlab==4.2.2",
    "Pillow==10.4.0",

    # AI
    "google-generativeai==0.7.2",
    "openai==1.35.14",
    "tenacity==8.4.2",

    # HTTP
    "httpx==0.27.0",

    # Utilities
    "python-slugify==8.0.4",
    "structlog==24.2.0",
    "aiofiles==24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.2",
    "pytest-asyncio==0.23.7",
    "pytest-cov==5.0.0",
    "httpx==0.27.0",
    "anyio==4.4.0",
    "ruff==0.5.1",
    "mypy==1.10.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "alembic/*"]
