version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: resumemaker_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-resumemaker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-resumemaker_dev}
      POSTGRES_DB: ${POSTGRES_DB:-resumemaker}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-resumemaker}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: resumemaker_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-resumemaker}:${POSTGRES_PASSWORD:-resumemaker_dev}@db:5432/${POSTGRES_DB:-resumemaker}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - upload_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: resumemaker_frontend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    command: npm run dev

volumes:
  postgres_data:
  upload_data:
